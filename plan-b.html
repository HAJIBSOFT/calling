<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل المواعيد والطباعة (Plan B)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .planb-container {
      width: 95%;
      max-width: 950px;
      margin: 1.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
      background: #ffffff;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .action-btn {
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-print { background: #0f172a; color: white; }
    .btn-print:hover { background: #1e293b; }
    .btn-reset { background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; }
    .btn-reset:hover { background: #fee2e2; }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; text-align: right; }
    th, td { padding: 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { background: #f8fafc; font-weight: 700; color: var(--text-muted); }

    /* تخصيص إعدادات الطباعة وإلغاء حظر الـ CSS */
    @media print {
      html, body {
        display: block !important;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print, .toolbar, .nav-links, .tabs {
        display: none !important;
      }
      .planb-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .form-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      table {
        width: 100% !important;
        border: 1px solid #333 !important;
      }
      th, td {
        border: 1px solid #ccc !important;
        padding: 8px !important;
        color: #000 !important;
      }
      th {
        background-color: #f2f2f2 !important;
      }
      .print-header {
        display: block !important;
        text-align: center;
        margin-bottom: 15px;
      }
    }

    .print-header {
      display: none;
    }
  </style>
</head>
<body>

  <div class="planb-container">
    
    <!-- ترويسة تظهر فقط في الطباعة الورقية -->
    <div class="print-header">
      <h2 style="margin-bottom: 4px;">كشف الحضور والمواعيد</h2>
      <p style="font-size: 0.85rem; color: #555;" id="printDate"></p>
    </div>

    <!-- شريط الروابط العلوي -->
    <div class="nav-links" style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-weight: 800; font-size: 1.35rem;"> إدارة السجلات والطباعة</h2>
      <div style="display: flex; gap: 0.75rem;">
        <a href="admin.html" style="color: var(--primary); text-decoration: none; font-weight: 700; background: var(--primary-light); padding: 0.4rem 0.8rem; border-radius: 8px;">شاشة المناداة ↗</a>
      </div>
    </div>

    <!-- شريط الأدوات: تصفير العداد، بحث، وطباعة -->
    <div class="toolbar no-print">
      <input type="text" id="searchInput" class="mobile-input" style="max-width: 280px; height: 44px;" placeholder="ابحث بالاسم أو رقم الجوال...">
      
      <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
        <button onclick="startPrint()" class="action-btn btn-print"> طباعة الكشف</button>
        <button onclick="resetCounterWithoutDeleting()" class="action-btn btn-reset"> تصفير العداد (البدء برقم 1 )</button>
      </div>
    </div>

    <!-- أزرار التبديل بين الجلسة النشطة والأرشيف القديم -->
    <div class="tabs no-print">
      <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">الجلسة الحالية النشطة</button>
      <button class="tab-btn" id="tabAll" onclick="switchTab('all')">كامل السجل (يشمل المؤرشفة)</button>
    </div>

    <!-- جدول البيانات -->
    <div class="form-card" style="padding: 1rem;">
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>رقم التذكرة</th>
              <th>الاسم الكامل</th>
              <th>رقم الجوال</th>
              <th>وقت التسجيل</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="backupList">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-muted);">جاري تحميل السجل...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    let allVisitors = [];
    let currentTab = 'active';

    // ضبط تاريخ الطباعة تلقائياً
    document.getElementById("printDate").innerText = "تاريخ الطباعة: " + new Date().toLocaleString('ar-SA');

    async function loadData() {
      const { data, error } = await db
        .from('visitors')
        .select('*')
        .order('id', { ascending: true });

      if (!error && data) {
        allVisitors = data;
        filterAndRender();
      }
    }

    function filterAndRender() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      let list = allVisitors;

      // تصفية حسب التبويب المختار
      if (currentTab === 'active') {
        list = list.filter(v => v.status !== 'archived');
      }

      // تصفية حسب البحث
      if (q) {
        list = list.filter(v => 
          v.name.toLowerCase().includes(q) || 
          v.phone.includes(q) || 
          String(v.ticket_number).includes(q)
        );
      }

      renderTable(list);
    }

    function renderTable(list) {
      const tbody = document.getElementById("backupList");
      tbody.innerHTML = "";

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">لا توجد أي بيانات مسجلة في هذا القسم</td></tr>`;
        return;
      }

      list.forEach(v => {
        const time = new Date(v.created_at).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
        
        let statusBadge = 'في الانتظار';
        if (v.status === 'calling') statusBadge = 'قيد المقابلة';
        if (v.status === 'completed') statusBadge = 'منتهي';
        if (v.status === 'archived') statusBadge = 'مؤرشف (جلسة سابقة)';

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong style="color: var(--primary);">#${v.ticket_number}</strong></td>
          <td style="font-weight: 600;">${v.name}</td>
          <td style="font-family: monospace;">${v.phone}</td>
          <td>${time}</td>
          <td><strong>${statusBadge}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tabActive").classList.toggle("active", tab === 'active');
      document.getElementById("tabAll").classList.toggle("active", tab === 'all');
      filterAndRender();
    }

    // أمر تشغيل الطباعة
    function startPrint() {
      window.print();
    }

    // تصفير العداد بدون حذف أي بيانات سابقة
    async function resetCounterWithoutDeleting() {
      const confirmReset = confirm(
        "هل أنت متأكد من تصفير العداد لبدء جلسة جديدة؟\n\n- ستبدأ التذاكر الجديدة من الرقم 1 مجدداً.\n- جميع البيانات السابقة ستبقى محفوظة بالكامل في خانة (الأرشيف) ولن يُحذف أي اسم."
      );

      if (!confirmReset) return;

      try {
        // تحويل كافة الزوار الحاليين إلى حالة "مؤرشف"
        const { error } = await db
          .from('visitors')
          .update({ status: 'archived' })
          .neq('status', 'archived');

        if (error) throw error;

        alert("تم تصفير العداد بنجاح! التذكرة القادمة ستكون رقم #1، مع بقاء كافة بياناتك السابقة آمنة.");
        loadData();
      } catch (err) {
        alert("حدث خطأ أثناء التصفير: " + err.message);
      }
    }

    document.getElementById("searchInput").addEventListener("input", filterAndRender);

    loadData();

    // تحديث فوري إذا سجل أي زائر
    db.channel('public:planb_updates')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'visitors' }, () => {
        loadData();
      })
      .subscribe();
  </script>
</body>
</html>
