<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شاشة المناداة</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; text-align: right; }
    th, td { padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
    .badge { padding: 0.25rem 0.65rem; border-radius: 8px; font-size: 0.75rem; font-weight: 700; }
    .badge-waiting { background: #fef3c7; color: #d97706; }
    .badge-calling { background: #d1fae5; color: #059669; }
    .badge-completed { background: #f1f5f9; color: #64748b; }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 1.3rem; font-weight: 800;"> مناداة المتقدمين</h2>
      <div style="display: flex; gap: 0.75rem;">
        <a href="plan-b.html" style="font-size: 0.85rem; color: #059669; text-decoration: none; font-weight: 700; background: #ecfdf5; padding: 0.4rem 0.8rem; border-radius: 8px;">جدول الطوارئ (Plan B) 📋</a>
        <a href="index.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 700; background: var(--primary-light); padding: 0.4rem 0.8rem; border-radius: 8px;">صفحة الزائر ↗</a>
      </div>
    </div>

    <!-- بطاقة المناداة للزائر التالي -->
    <div class="ticket-card">
      <span class="ticket-tag">الرقم حالياً</span>
      <div class="visitor-huge-number" id="adminServingTicket">--</div>
      <h3 id="adminServingName" style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 1.5rem;">لا يوجد شخص حالياً</h3>

      <button id="callNextBtn" class="btn-submit" style="max-width: 280px;">
          التالي ❯
      </button>
    </div>

    <!-- جدول المراجعين المتزامن فوراً -->
    <div class="form-card" style="padding: 1.25rem;">
      <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem;">قائمة المتقدمين اليوم</h3>
      <div style="overflow-x: auto; width: 100%;">
        <table>
          <thead>
            <tr>
              <th>الرقم</th>
              <th>الاسم</th>
              <th>رقم الجوال</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="visitorsTable">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-muted);">جاري الاتصال...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const nextBtn = document.getElementById("callNextBtn");

    async function refreshDashboard() {
      try {
        // 1. جلب المراجع الحالي
        const { data: current } = await db
          .from('visitors')
          .select('*')
          .eq('status', 'calling')
          .order('called_at', { ascending: false })
          .limit(1);

        if (current && current.length > 0) {
          document.getElementById("adminServingTicket").innerText = current[0].ticket_number;
          document.getElementById("adminServingName").innerText = `${current[0].name} (${current[0].phone})`;
        } else {
          document.getElementById("adminServingTicket").innerText = "--";
          document.getElementById("adminServingName").innerText = "لا يوجد شخص حالياً";
        }

        // 2. تحديث جدول الزوار
        const { data: list } = await db
          .from('visitors')
          .select('*')
          .order('ticket_number', { ascending: true });

        const tbody = document.getElementById("visitorsTable");
        tbody.innerHTML = "";

        if (!list || list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">لا توجد حجوزات مسجلة</td></tr>`;
          return;
        }

        list.forEach((v) => {
          let bClass = "badge-waiting";
          let statusAr = "في الانتظار";
          if (v.status === "calling") { bClass = "badge-calling"; statusAr = "قيد المقابلة"; }
          if (v.status === "completed") { bClass = "badge-completed"; statusAr = "منتهي"; }

          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>#${v.ticket_number}</strong></td>
            <td>${v.name}</td>
            <td style="font-family: monospace;">${v.phone}</td>
            <td><span class="badge ${bClass}">${statusAr}</span></td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error("خطأ التحديث:", err);
      }
    }

    // زر مناداة التالي
    nextBtn.addEventListener("click", async () => {
      nextBtn.disabled = true;
      nextBtn.innerText = "جاري الاستدعاء...";

      try {
        // إنهاء المقابلة الحالية
        await db.from('visitors').update({ status: 'completed' }).eq('status', 'calling');

        // مناداة أول شخص في قائمة الانتظار
        const { data: nextPerson } = await db
          .from('visitors')
          .select('id')
          .eq('status', 'waiting')
          .order('ticket_number', { ascending: true })
          .limit(1);

        if (nextPerson && nextPerson.length > 0) {
          await db.from('visitors').update({ 
            status: 'calling', 
            called_at: new Date().toISOString() 
          }).eq('id', nextPerson[0].id);
        } else {
          alert("لا يوجد مراجعين في قائمة الانتظار حالياً.");
        }
      } catch (err) {
        alert("حدث خطأ أثناء التحديث: " + err.message);
      } finally {
        nextBtn.disabled = false;
        nextBtn.innerText = "مناداة الزائر التالي ❯";
      }
    });

    // تشغيل لمرة واحدة عند تحميل الصفحة
    refreshDashboard();

    // استماع فوري لأي تغيير في قاعدة البيانات
    db.channel('public:admin')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'visitors' }, () => {
        refreshDashboard();
      })
      .subscribe();
  </script>
</body>
</html>
